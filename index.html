<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SEDA BANUS — Alta Sericicultura de Lujo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Montserrat:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --silk-white: #FAF8F3;
      --bone: #F0EDE5;
      --sky-soft: #C8DFF0;
      --sky-mid: #A8C8E8;
      --sky-deep: #7FAFD4;
      --sky-accent: #5B96C2;
      --gold: #C9A96E;
      --gold-light: #E8D5A8;
      --charcoal: #2C2C2C;
      --shadow: rgba(91,150,194,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--silk-white);
      color: var(--charcoal);
      overflow-x: hidden;
      cursor: none;
    }

    /* CURSOR */
    #cursor {
      position: fixed;
      width: 40px; height: 40px;
      pointer-events: none; z-index: 99999;
      transform: translate(-50%,-50%);
    }
    #cursor-ring {
      position: fixed;
      width: 50px; height: 50px;
      border-radius: 50%;
      border: 1px solid rgba(91,150,194,0.4);
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%,-50%);
    }

    /* NAV */
    nav {
      position: fixed; top: 0; width: 100%;
      z-index: 1000;
      padding: 0 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
      background: rgba(250,248,243,0.92);
      backdrop-filter: blur(20px);
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      letter-spacing: 6px;
      text-decoration: none;
      color: var(--charcoal);
    }

    /* HERO */
    #home {
      position: relative;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 🔥 AQUÍ ESTÁ EL FIX IMPORTANTE */
    #hero-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
    }

    #hero-video iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120vw;
      height: 120vh;
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.15);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 900px;
    }

    .hero-title {
      font-size: 90px;
      color: white;
    }

  </style>
</head>

<body>

  <!-- CURSOR -->
  <div id="cursor">✦</div>
  <div id="cursor-ring"></div>

  <!-- NAV -->
  <nav>
    <a class="nav-logo">SEDA BANUS</a>
  </nav>

  <!-- HERO -->
  <section id="home">

    <!-- 🔥 VÍDEO ARREGLADO -->
    <div id="hero-video">
      <iframe
        src="https://www.youtube.com/embed/DtcB7emysx8?autoplay=1&mute=1&loop=1&playlist=DtcB7emysx8&controls=0&showinfo=0&modestbranding=1"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1 class="hero-title">SEDA BANUS</h1>
    </div>

  </section>

</body>
</html>
